apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluxed-task-data
  namespace: task5
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fluxed-task, namespace: task5}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: fluxed-task}}
  template:
    metadata: {labels: {app: fluxed-task}}
    spec:
      imagePullSecrets: [{name: gitlab-registry}]
      containers:
        - name: fluxed-task
          image: registry.gitlab.com/niwzer/devops-task4:build-63 # {"$imagepolicy": "flux-system:fluxed-task"}
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              mkdir -p /data/media_root
              ln -sfn /data/db.sqlite3 /data/media_root /app/build/
              python manage.py migrate --noinput
              exec gunicorn demo.wsgi:application --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
          readinessProbe:
            httpGet: {path: /, port: 8000, httpHeaders: [{name: Host, value: localhost}]}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: fluxed-task-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: fluxed-task, namespace: task5}
spec:
  selector: {app: fluxed-task}
  ports: [{name: http, port: 80, targetPort: 8000}]
